name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  # The exact Fe release this project is built and tested with.
  FE_VERSION: v26.6.0

jobs:
  fe:
    name: Fe (fmt, test, compile-fail, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - run: fe --version
      - run: make fmt-check
      - name: fe test (all ingots)
        run: fe test --report --report-out fe-test-report.tar.gz
      - run: make compile-fail
      - run: make lint
      - run: make fe-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: EIP-712 vectors are fresh for this bytecode
        run: make vectors-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fe-test-report
          path: fe-test-report.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: contracts
          path: out/

  e2e:
    name: E2E (anvil --hardfork osaka)
    runs-on: ubuntu-latest
    needs: fe
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: make e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e
          path: |
            e2e/results.json
            docs/gas.json

  app:
    name: App (build + Playwright)
    runs-on: ubuntu-latest
    needs: fe
    steps:
      - uses: actions/checkout@v5
      - name: Install Fe
        run: |
          curl -fsSL https://raw.githubusercontent.com/argotorg/fe/master/feup/feup.sh | bash -s -- --version "$FE_VERSION" --no-modify-path
          echo "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: cd app && npm ci --no-audit --no-fund
      - run: cd app && npx playwright install --with-deps chromium
      - run: make playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright
          path: |
            app/playwright-report/
            app/test-results/

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
